name = "bench-loop-api"
main = "src/index.ts"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]

# api.bench-loop.com — public submit + leaderboard endpoint
# Routes are added after the bench-loop.com zone activates in CF.
# Add via: wrangler deploy then `wrangler triggers deploy` or dashboard.
routes = [
  { pattern = "api.bench-loop.com", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "bench-loop"
database_id = "62cbcfca-fe7b-416c-94e3-860e732cf4ca"

[vars]
ENVIRONMENT = "production"
# Comma-separated list of trusted submit sources. Empty = anyone can submit.
# We rate-limit + dedupe by run_id so abuse is bounded.
ALLOWED_ORIGINS = "*"

# Ask Loop is deliberately tighter than the public leaderboard and submission
# endpoints. This binding is a fast, permissive abuse guard; authenticated
# account quotas can replace the anonymous client/IP key after auth ships.
[[ratelimits]]
name = "ASK_RATE_LIMITER"
namespace_id = "3827001"

  [ratelimits.simple]
  limit = 6
  period = 60

[observability]
enabled = true
head_sampling_rate = 1
